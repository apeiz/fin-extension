<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>入夜</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <div class="popup-head">
      <div class="brand">
        <span class="dot"></span>
        <h1>入夜</h1>
      </div>
      <label class="switch" title="总开关">
        <input type="checkbox" id="globalToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section">
      <div class="section-label">当前网站</div>
      <div class="host-row">
        <span class="host-name" id="currentHost">读取中</span>
        <label class="switch" title="此站点开关">
          <input type="checkbox" id="siteToggle" disabled />
          <span class="slider"></span>
        </label>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="popup-foot">
      <span class="note">改动立即生效</span>
      <button class="ghost" id="openOptions">管理站点列表</button>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
